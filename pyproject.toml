[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gridworld"
version = "0.1.0"
description = "Autonomous electrical grid control experimentation and evaluation framework"
authors = [{ name = "Bradley Haraguchi" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "grid2op>=1.12.0",
    "pandapower>=3.0.0",
    "lightsim2grid>=1.3.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "numpy<3",
    "pandas<3",
    "scipy>=1.10.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0"
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
